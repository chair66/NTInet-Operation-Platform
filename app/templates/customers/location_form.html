{% extends "base.html" %}
{% block title %}Edit Location · {{ app_name }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-start mb-4"><div><div class="eyebrow">{{ customer.customer_number }}</div><h1>Edit Location</h1><p class="text-muted mb-0">{{ customer.name }}</p></div><a class="btn btn-outline-secondary" href="/customers/{{ customer.id }}">Cancel</a></div>
<form class="panel customer-form" method="post" action="/customers/{{ customer.id }}/locations/{{ location.id }}/edit"><div class="panel-header"><h2>{{ location.name }}</h2></div><div class="panel-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Location name</label><input class="form-control" name="name" required value="{{ location.name }}"></div><div class="col-md-6"><label class="form-label">Onsite contact</label><select class="form-select" name="primary_contact_id"><option value="">Not assigned</option>{% for contact in customer.contacts %}<option value="{{ contact.id }}" {{ 'selected' if location.primary_contact_id == contact.id else '' }}>{{ contact.full_name }}</option>{% endfor %}</select></div><div class="col-md-8"><label class="form-label">Address</label><input class="form-control" name="address_line_1" required value="{{ location.address_line_1 }}"></div><div class="col-md-4"><label class="form-label">Suite/unit</label><input class="form-control" name="address_line_2" value="{{ location.address_line_2 }}"></div><div class="col-md-5"><label class="form-label">City</label><input class="form-control" name="city" required value="{{ location.city }}"></div><div class="col-md-3"><label class="form-label">State</label><input class="form-control" name="state" required value="{{ location.state }}"></div><div class="col-md-4"><label class="form-label">ZIP</label><input class="form-control" name="postal_code" required value="{{ location.postal_code }}"></div><div class="col-md-6"><label class="form-label">Service territory</label><input class="form-control" name="service_territory" value="{{ location.service_territory }}"></div><div class="col-md-6"><label class="form-label">Tax jurisdiction</label><input class="form-control" name="tax_jurisdiction" value="{{ location.tax_jurisdiction }}"></div><div class="col-md-6"><label class="form-label">Access instructions</label><textarea class="form-control" name="access_instructions" rows="3">{{ location.access_instructions }}</textarea></div><div class="col-md-6"><label class="form-label">Dispatch notes</label><textarea class="form-control" name="dispatch_notes" rows="3">{{ location.dispatch_notes }}</textarea></div><div class="col-12 d-flex gap-4"><label class="form-check"><input class="form-check-input" type="checkbox" name="is_primary" {{ 'checked' if location.is_primary else '' }}> Primary location</label><label class="form-check"><input class="form-check-input" type="checkbox" name="active" {{ 'checked' if location.active else '' }}> Active</label></div></div></div><div class="customer-form-actions"><a class="btn btn-outline-secondary" href="/customers/{{ customer.id }}">Cancel</a><button class="btn btn-primary">Save Location</button></div></form>
{% endblock %}
