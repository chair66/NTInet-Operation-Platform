{% extends "base.html" %}
{% block title %}Edit Contact · {{ app_name }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-start mb-4"><div><div class="eyebrow">{{ customer.customer_number }}</div><h1>Edit Contact</h1><p class="text-muted mb-0">{{ customer.name }}</p></div><a class="btn btn-outline-secondary" href="/customers/{{ customer.id }}">Cancel</a></div>
<form class="panel customer-form" method="post" action="/customers/{{ customer.id }}/contacts/{{ contact.id }}/edit"><div class="panel-header"><h2>{{ contact.full_name }}</h2></div><div class="panel-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input class="form-control" name="first_name" required value="{{ contact.first_name }}"></div><div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" name="last_name" value="{{ contact.last_name }}"></div><div class="col-md-6"><label class="form-label">Job title</label><input class="form-control" name="job_title" value="{{ contact.job_title }}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ contact.email }}"></div><div class="col-md-6"><label class="form-label">Office phone</label><input class="form-control" name="office_phone" value="{{ contact.office_phone }}"></div><div class="col-md-6"><label class="form-label">Mobile/SMS phone</label><input class="form-control" name="mobile_phone" value="{{ contact.mobile_phone }}"></div><div class="col-md-6"><label class="form-label">Preferred channel</label><select class="form-select" name="preferred_channel">{% for value in ['email','sms','phone'] %}<option value="{{ value }}" {{ 'selected' if contact.preferred_channel == value else '' }}>{{ value|title }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">SMS consent</label><select class="form-select" name="sms_consent_status">{% for value in ['unknown','consented','opted_out'] %}<option value="{{ value }}" {{ 'selected' if contact.sms_consent_status == value else '' }}>{{ value|replace('_',' ')|title }}</option>{% endfor %}</select></div><div class="col-12 d-flex flex-wrap gap-4"><label class="form-check"><input class="form-check-input" type="checkbox" name="is_primary" {{ 'checked' if contact.is_primary else '' }}> Primary contact</label><label class="form-check"><input class="form-check-input" type="checkbox" name="authorized_for_support" {{ 'checked' if contact.authorized_for_support else '' }}> Support authorized</label><label class="form-check"><input class="form-check-input" type="checkbox" name="authorized_for_estimates" {{ 'checked' if contact.authorized_for_estimates else '' }}> May approve estimates</label><label class="form-check"><input class="form-check-input" type="checkbox" name="receives_invoices" {{ 'checked' if contact.receives_invoices else '' }}> Receives invoices</label><label class="form-check"><input class="form-check-input" type="checkbox" name="active" {{ 'checked' if contact.active else '' }}> Active</label></div></div></div><div class="customer-form-actions"><a class="btn btn-outline-secondary" href="/customers/{{ customer.id }}">Cancel</a><button class="btn btn-primary">Save Contact</button></div></form>
{% endblock %}
