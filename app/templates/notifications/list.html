{% extends "base.html" %}{% block title %}Notifications · {{ app_name }}{% endblock %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><div><div class="eyebrow">Activity</div><h1 class="h3 mb-1">Notifications</h1><p class="text-muted mb-0">Customer replies and ticket activity assigned to you.</p></div><form method="post" action="/notifications/read-all"><button class="btn btn-outline-secondary">Mark All Read</button></form></div>
<section class="card"><div class="list-group list-group-flush">{% for event in events %}<form method="post" action="/notifications/{{ event.id }}/read"><button class="list-group-item list-group-item-action text-start w-100 py-3 {{ 'bg-light' if not event.read_at else '' }}"><div class="d-flex justify-content-between gap-3"><strong>{{ event.subject or event.event_type|replace('_',' ')|title }}</strong>{% if not event.read_at %}<span class="badge text-bg-primary">New</span>{% endif %}</div><small class="text-muted">{{ event.created_at.strftime('%m/%d/%Y %I:%M %p') }}</small></button></form>{% else %}<div class="text-center text-muted py-5">No notifications yet.</div>{% endfor %}</div></section>
{% endblock %}
