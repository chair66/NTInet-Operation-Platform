{% extends "base.html" %}{% block title %}New Estimate · {{ app_name }}{% endblock %}{% block content %}<div class="mb-4"><a href="/estimates">← Estimates</a><h1 class="h3 mt-2">New Estimate</h1></div><form class="card" method="post" action="/estimates"><div class="card-body p-4"><div class="row g-3"><div class="col-md-6"><label class="form-label">Customer</label><select id="customer" class="form-select" name="customer_id" required><option value="">Select customer</option>{% for c in customers %}<option value="{{ c.id }}" {{ 'selected' if selected_customer_id==c.id }}>{{ c.name }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Contact</label><select class="form-select linked" name="contact_id"><option value="">No contact</option>{% for c in customers %}{% for x in c.contacts if x.active %}<option data-customer="{{ c.id }}" value="{{ x.id }}">{{ x.full_name }}</option>{% endfor %}{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Location</label><select class="form-select linked" name="location_id" required><option value="">Select location</option>{% for c in customers %}{% for x in c.locations if x.active %}<option data-customer="{{ c.id }}" value="{{ x.id }}">{{ x.name }}</option>{% endfor %}{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Estimate title</label><input class="form-control" name="title" required></div><div class="col-md-3"><label class="form-label">Valid until</label><input class="form-control" type="date" name="valid_until"></div><div class="col-md-3"><label class="form-label">Tax rate</label><div class="input-group"><input class="form-control" type="number" min="0" max="100" step=".001" name="tax_rate" value="0"><span class="input-group-text">%</span></div></div><div class="col-md-6"><label class="form-label">Customer notes</label><textarea class="form-control" rows="3" name="customer_notes"></textarea></div><div class="col-md-6"><label class="form-label">Internal notes</label><textarea class="form-control" rows="3" name="internal_notes"></textarea></div></div></div><div class="card-footer text-end"><button class="btn btn-primary">Create Estimate</button></div></form><script>document.addEventListener('DOMContentLoaded',()=>{const c=document.querySelector('#customer'),sync=()=>document.querySelectorAll('.linked option[data-customer]').forEach(o=>{o.hidden=o.dataset.customer!==c.value;if(o.hidden&&o.selected)o.selected=false});c.addEventListener('change',sync);sync()});</script>{% endblock %}
