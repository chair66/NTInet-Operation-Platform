{% extends "base.html" %}{% block content %}<div class="page-header"><div><h1>Create Domain</h1><p>Defaults are controlled by Platform Administration.</p></div></div><form method="post" action="/digicloud/domains" class="card"><div class="card-body row g-3">
<div class="col-md-6"><label>Organization</label><select class="form-select" name="organization_id">{% for o in organizations %}<option value="{{o.id}}" {% if o.id==selected_org_id %}selected{% endif %}>{{o.effective_name}}</option>{% endfor %}</select></div><div class="col-md-6"><label>Domain Name</label><input class="form-control" name="domain_name" required></div>
<div class="col-12"><label>Description</label><input class="form-control" name="description"></div><div class="col-md-6"><label>Caller ID Name</label><input class="form-control" name="caller_id_name"></div><div class="col-md-6"><label>Caller ID Number</label><input class="form-control" name="caller_id_number"></div><div class="col-md-6"><label>Emergency Caller ID</label><input class="form-control" name="emergency_caller_id"></div><div class="col-md-3"><label>Area Code</label><input class="form-control" name="area_code" value="{{defaults.default_area_code}}"></div><div class="col-md-3"><label>Time Zone</label><input class="form-control" name="time_zone" value="{{defaults.default_time_zone}}"></div>
<div class="col-md-3"><label>Concurrent Calls</label><input class="form-control" type="number" name="max_calls" value="{{defaults.default_max_calls}}"></div><div class="col-md-3"><label>Off-Net Calls</label><input class="form-control" type="number" name="max_offnet_calls" value="{{defaults.default_max_offnet_calls}}"></div><div class="col-md-3 form-check mt-5"><input class="form-check-input" type="checkbox" name="recording_enabled" {% if defaults.default_recording_enabled %}checked{% endif %}><label class="form-check-label">Recording</label></div><div class="col-md-3 form-check mt-5"><input class="form-check-input" type="checkbox" name="transcription_enabled" {% if defaults.default_transcription_enabled %}checked{% endif %}><label class="form-check-label">Transcription</label></div>
<div class="col-md-6"><label>Transcription Provider</label><input class="form-control" name="transcription_provider" value="{{defaults.default_transcription_provider}}"></div><div class="col-md-6"><label>Email From</label><input class="form-control" type="email" name="email_from" value="{{defaults.default_email_from}}"></div><div class="col-12 form-check"><input class="form-check-input" type="checkbox" name="sync_provider" checked><label class="form-check-label">Create in NetSapiens now</label></div></div><div class="card-footer"><button class="btn btn-primary">Create Domain</button> <a class="btn btn-secondary" href="/digicloud/domains">Cancel</a></div></form>{% endblock %}
