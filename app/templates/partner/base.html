<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NTInet Support Portal{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', path='brand/favicon.png') }}" type="image/png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', path='partner-portal.css') }}?v={{ app_version }}"></head>
<body><header class="partner-header"><a class="partner-brand" href="/partner"><img src="{{ url_for('static', path='brand/ntinet-white-transparent.png') }}" alt="NTInet broadband, voice and IT solutions"><span>Support Portal</span></a><nav><a href="/partner"><i class="fa-solid fa-ticket"></i><span>My Tickets</span>{% if unread_notifications %}<b class="nav-count">{{ unread_notifications }}</b>{% endif %}</a><a href="/partner/tickets/new"><i class="fa-solid fa-circle-plus"></i><span>New Ticket</span></a><form method="post" action="/logout"><button><i class="fa-solid fa-right-from-bracket"></i><span>Sign Out</span></button></form></nav></header>
<main class="partner-main">{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>{% block scripts %}{% endblock %}</body></html>
