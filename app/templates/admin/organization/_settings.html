<div class="tab-pane fade" id="settings" role="tabpanel" aria-labelledby="settings-tab" tabindex="0">
  <form method="post" action="/admin/organizations/{{ org.id }}/settings">
    <div class="row g-4">
      <div class="col-xl-6"><div class="panel h-100"><div class="panel-body"><h2 class="h5 mb-3">Security policy</h2>
        <div class="mb-3"><label class="form-label">MFA policy</label><select class="form-select" name="mfa_policy"><option value="optional" {{ 'selected' if org.mfa_policy == 'optional' }}>Optional</option><option value="required" {{ 'selected' if org.mfa_policy == 'required' }}>Required</option></select><div class="form-text">Selecting Required marks all current non-deleted users as MFA required.</div></div>
        <div class="mb-3"><label class="form-label">Password expiration</label><select class="form-select" name="password_expiration_days">{% for days,label in [(0,'Never'),(30,'30 days'),(60,'60 days'),(90,'90 days'),(180,'180 days'),(365,'365 days')] %}<option value="{{ days }}" {{ 'selected' if org.password_expiration_days == days }}>{{ label }}</option>{% endfor %}</select></div>
        <div class="mb-3"><label class="form-label">Session timeout (minutes)</label><input class="form-control" type="number" min="15" max="1440" name="session_timeout_minutes" value="{{ org.session_timeout_minutes }}"></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" name="allow_api_access" value="true" id="allowApi" {{ 'checked' if org.allow_api_access }}><label class="form-check-label" for="allowApi">Allow organization API access</label></div>
      </div></div></div>
      <div class="col-xl-6"><div class="panel h-100"><div class="panel-body"><h2 class="h5 mb-3">Organization defaults</h2>
        <div class="mb-3"><label class="form-label">Time zone</label><input class="form-control" name="timezone_name" value="{{ org.timezone }}" maxlength="64"><div class="form-text">Use an IANA time zone such as America/New_York.</div></div>
        <div class="mb-3"><label class="form-label">Date format</label><select class="form-select" name="date_format"><option value="MM/DD/YYYY" {{ 'selected' if org.date_format == 'MM/DD/YYYY' }}>MM/DD/YYYY</option><option value="YYYY-MM-DD" {{ 'selected' if org.date_format == 'YYYY-MM-DD' }}>YYYY-MM-DD</option></select></div>
        <div class="mb-3"><label class="form-label">Default role for new users</label><select class="form-select" name="default_role_id"><option value="">No default role</option>{% for role in default_roles %}<option value="{{ role.id }}" {{ 'selected' if org.default_role_id == role.id }}>{{ role.name }}{% if role.is_system %} (System){% endif %}</option>{% endfor %}</select></div>
      </div></div></div>
    </div>
    {% if not org.is_deleted %}<button class="btn btn-primary mt-4">Save settings</button>{% endif %}
  </form>
</div>
