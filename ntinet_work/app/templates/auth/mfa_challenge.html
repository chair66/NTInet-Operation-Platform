<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify identity | NTInet</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"></head>
<body class="login-page"><div class="login-shell"><div class="login-brand"><img src="{{ url_for('static', path='brand/ntinet-logo-dark-bg.png') }}" alt="NTInet"><span>Operations</span></div><div class="login-card"><h1>Verify your identity</h1><p>Enter the code from your authenticator app.</p>{% if error_message %}<div class="alert alert-danger">{{ error_message }}</div>{% endif %}<form method="post" action="/mfa/challenge"><label class="form-label">Authenticator or recovery code</label><input class="form-control form-control-lg text-center" name="code" autocomplete="one-time-code" autofocus required placeholder="000000"><div class="form-check mt-3"><input class="form-check-input" type="checkbox" name="trust_device" value="true" id="trustDevice"><label class="form-check-label" for="trustDevice">Trust this browser for 30 days</label></div><button class="btn btn-primary w-100 mt-4">Verify</button></form><p class="small text-muted mt-3 mb-0">A one-time recovery code may also be entered.</p></div><div class="login-note">Secure multi-factor authentication</div></div></body></html>
