<div class="tab-pane fade" id="activity" role="tabpanel" aria-labelledby="activity-tab" tabindex="0">
  <div class="panel"><div class="panel-header"><div><h2>Recent activity</h2><p>Organization changes and administrative events.</p></div></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Date</th><th>Action</th><th>Detail</th><th>Module</th></tr></thead><tbody>{% for log in audit_logs %}<tr><td class="text-nowrap">{{ log.created_at.strftime('%Y-%m-%d %H:%M') }}</td><td>{{ log.action }}</td><td>{{ log.detail }}</td><td>{{ log.module or '—' }}</td></tr>{% else %}<tr><td colspan="4" class="text-muted text-center py-4">No activity recorded.</td></tr>{% endfor %}</tbody></table></div></div>
</div>
