<div class="tab-pane fade" id="modules" role="tabpanel" aria-labelledby="modules-tab" tabindex="0">
  <div class="panel">
    <div class="panel-body">
      <h2 class="h5 mb-1">Module assignment</h2>
      <p class="text-muted mb-3">Choose which platform modules this organization may access. User permissions still control the actions available inside each module.</p>
      <form method="post" action="/admin/organizations/{{ org.id }}/modules">
        <div class="row g-3">
          {% for module in available_modules %}
          <div class="col-md-6 col-xl-4"><label class="module-choice border rounded p-3 d-flex gap-3 h-100 w-100">
            <input class="form-check-input mt-1" type="checkbox" name="module_slugs" value="{{ module.slug }}" {{ 'checked' if module_assignments.get(module.slug) }} {{ 'disabled' if org.is_deleted }}>
            <span><strong>{{ module.name }}</strong><span class="d-block small text-muted">{{ module.slug }}{% if module.staff_only %} · Staff only{% endif %}</span></span>
          </label></div>
          {% endfor %}
        </div>
        {% if not org.is_deleted %}<button class="btn btn-primary mt-4">Save modules</button>{% endif %}
      </form>
    </div>
  </div>
</div>
